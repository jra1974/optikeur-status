# ==============================================================================
# OptiKeur Enterprise Status & Uptime Monitor
# Aangedreven door GitHub Actions & GitHub Pages
# ==============================================================================

owner: UW_GITHUB_GEBRUIKERSNAAM # Vervang door uw GitHub gebruikersnaam of organisatie
repo: optikeur-status           # De naam van uw repository

sites:
  - name: OptiKeur Webplatform
    url: https://optikeur.nl
    icon: https://optikeur.nl/favicon.svg

  - name: Core API & Database Health (SLA 99,9%)
    url: https://optikeur.nl/api.php?action=health
    icon: https://optikeur.nl/favicon.svg

  - name: Enterprise Security Dossier
    url: https://optikeur.nl/security.html
    icon: https://optikeur.nl/favicon.svg

# Custom Domain configuratie
cname: status.optikeur.nl

# Huisstijl & Branding
status-website:
  cname: status.optikeur.nl
  name: OptiKeur Systeemstatus
  introTitle: "Realtime Systeemstatus & 99,9% SLA Monitoring"
  introMessage: "Deze statuspagina bewaakt 24/7/365 onafhankelijk de beschikbaarheid van het OptiKeur Compliance Platform conform onze formele enterprise Service Level Agreement."
  navbar:
    - title: Naar OptiKeur.nl
      href: https://optikeur.nl
    - title: Security & SLA Dossier
      href: https://optikeur.nl/security.html

# Uptime schema (elke 5 minuten)
workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"

# Notificaties (optioneel, standaard via GitHub Issues)
assignees:
  - UW_GITHUB_GEBRUIKERSNAAM
